<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Реєстрація</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 350px; }
        h2 { text-align: center; color: #333; }
        .form-group { margin-bottom: 15px; display: flex; flexDirection: column; }
        label { font-size: 13px; font-weight: bold; margin-bottom: 5px; color: #555; }
        input { padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        button { width: 100%; padding: 10px; background: #28a745; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
        button:hover { background: #218838; }
        .error { background: #f8d7da; color: #721c24; padding: 8px; border-radius: 4px; font-size: 13px; margin-bottom: 15px; }
        .link { text-align: center; margin-top: 15px; font-size: 13px; }
        .link a { color: #007bff; text-decoration: none; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Реєстрація</h2>
        
        <!-- Блок помилок -->
        <div id="error-box" class="error" style="display: none;"></div>

        <form id="register-form">
            <div class="form-group">
                <label>ПІБ:</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div class="form-group">
                <label>Email:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label>Пароль:</label>
                <input type="password" id="password" name="password" required>
            </div>
            <div class="form-group">
                <label>Підтвердження пароля:</label>
                <input type="password" id="passwordConfirm" name="passwordConfirm" required>
            </div>
            <button type="submit">Зареєструватися</button>
        </form>
        <div class="link">
            Вже є акаунт? <a href="/login">Увійти</a>
        </div>
    </div>

    <script>
        const form = document.getElementById('register-form');
        const errorBox = document.getElementById('error-box');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorBox.style.display = 'none';

            const data = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                passwordConfirm: document.getElementById('passwordConfirm').value
            };

            const res = await fetch('/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            const result = await res.json();
            if (!res.ok) {
                errorBox.innerHTML = result.errors.map(err => err.msg).join('<br>');
                errorBox.style.display = 'block';
            } else {
                window.location.href = result.redirect;
            }
        });
    </script>
</body>
</html>
