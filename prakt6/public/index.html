<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>To-Do List REST API</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Список завдань (To-Do List)</h1>
        
        <form id="task-form">
            <input type="text" id="title" placeholder="Назва завдання..." required>
            <textarea id="description" placeholder="Опис завдання..."></textarea>
            <button type="submit">Додати завдання</button>
        </form>

        <ul id="task-list"></ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
